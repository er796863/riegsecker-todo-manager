<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../shared/entities.css" />
    <title>Schedules</title>
  </head>
  <body data-entity="schedules" data-mode="list" data-label="Schedules">
    <header data-global-header></header>

    <nav class="page-nav" aria-label="Schedule pages">
      <a href="./index.html">My schedule</a>
      <a href="./search.html">Search schedules</a>
    </nav>

    <main>
      <h1>My schedule</h1>
      <output id="status" aria-live="polite">Loading schedule...</output>
      <section id="schedule-summary" aria-labelledby="schedule-summary-heading" hidden>
        <h2 id="schedule-summary-heading">Your schedule</h2>
        <ul id="schedule-summary-list"></ul>
      </section>
      <form id="schedule-form" hidden>
        <label for="schedule-name">Schedule name</label>
        <input id="schedule-name" name="scheduleName" required maxlength="100" />
        <label for="notification-settings">Notification settings</label>
        <select id="notification-settings" name="notificationSettings">
          <option value="NONE">None</option>
          <option value="DAILY">Daily</option>
          <option value="WEEKLY">Weekly</option>
        </select>
        <fieldset id="schedule-task-options">
          <legend>Tasks to include in your schedule</legend>
          <div id="schedule-tasks">Loading available tasks...</div>
        </fieldset>
        <button id="schedule-submit" type="submit">Save schedule</button>
      </form>
    </main>
    <script type="module" src="./manage.js"></script>
  </body>
</html>
