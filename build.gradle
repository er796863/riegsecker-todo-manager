apply plugin: 'java'
apply plugin: 'jacoco'
apply plugin: 'war'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    compileOnly 'jakarta.platform:jakarta.jakartaee-web-api:8.0.0'

    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'org.mindrot:jbcrypt:0.4'
    providedRuntime 'com.mysql:mysql-connector-j:9.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'javax.servlet:javax.servlet-api:4.0.1'
    testImplementation 'org.mockito:mockito-core:5.17.0'
}

test {
    useJUnit()
    group = 'verification'
    description = 'Runs all automated tests.'
}

def tomcatVersion = '9.0.123'
def bundledTomcatHome = layout.projectDirectory.dir(".tools\\apache-tomcat-${tomcatVersion}").asFile
def tomcatHome = providers.environmentVariable('CATALINA_HOME').orElse(bundledTomcatHome.absolutePath)

def requireTomcatHome = {
    def home = file(tomcatHome.get())
    def launcher = file("${home}\\bin\\catalina.bat")
    if (!launcher.isFile()) {
        throw new GradleException("Tomcat was not found at ${home}. Set CATALINA_HOME to the Tomcat installation directory.")
    }
    home
}

tasks.register('prepareTomcat') {
    group = 'application'
    description = 'Downloads Tomcat when needed and configures its global datasource and Realm.'
    doLast {
        def home = file(tomcatHome.get())
        def launcher = file("${home}\\bin\\catalina.bat")
        if (!launcher.isFile()) {
            if (providers.environmentVariable('CATALINA_HOME').isPresent()) {
                throw new GradleException("Tomcat was not found at ${home} configured by CATALINA_HOME.")
            }

            def artifact = "apache-tomcat-${tomcatVersion}-windows-x64.zip"
            def baseUrl = "https://dlcdn.apache.org/tomcat/tomcat-9/v${tomcatVersion}/bin"
            def downloadDirectory = layout.buildDirectory.dir('tomcat-download').get().asFile
            downloadDirectory.mkdirs()
            def archive = file("${downloadDirectory}\\${artifact}")
            def checksumUrl = new URL("${baseUrl}/${artifact}.sha512")
            def expectedChecksum = checksumUrl.text.trim().split(/\s+/)[0].toLowerCase(Locale.ROOT)
            new URL("${baseUrl}/${artifact}").withInputStream { input ->
                archive.withOutputStream { output -> output << input }
            }
            def digest = java.security.MessageDigest.getInstance('SHA-512')
                    .digest(archive.bytes).encodeHex().toString()
            if (digest != expectedChecksum) {
                archive.delete()
                throw new GradleException("SHA-512 verification failed for ${artifact}.")
            }

            copy {
                from zipTree(archive)
                into file("${projectDir}\\.tools")
            }
            if (!launcher.isFile()) {
                throw new GradleException("Tomcat archive did not contain the expected directory: ${home}")
            }
        }

        exec {
            commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass',
                    '-File', file('scripts\\configure-tomcat.ps1').absolutePath,
                    '-TomcatHome', home.absolutePath
        }
    }
}

tasks.register('deployToTomcat') {
    group = 'application'
    description = 'Builds and deploys the WAR to the configured Tomcat server.'
    dependsOn tasks.named('war'), tasks.named('prepareTomcat')
    doLast {
        def home = requireTomcatHome()
        def webappsDirectory = file("${home}\\webapps")
        copy {
            from configurations.providedRuntime
            into file("${home}\\lib")
        }
        copy {
            from tasks.named('war').get().archiveFile
            into webappsDirectory
            rename { 'riegsecker-todo-manager.war' }
        }
        println "Deployed riegsecker-todo-manager.war to ${webappsDirectory}"
    }
}

tasks.register('run') {
    group = 'application'
    description = 'Builds, deploys, and starts the web application in Tomcat.'
    dependsOn tasks.named('prepareTomcat'), tasks.named('stopTomcat'), tasks.named('deployToTomcat')
    doLast {
        def home = requireTomcatHome()
        def javaHome = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(17)
        }.get().metadata.installationPath.asFile
        println "Application available at http://localhost:8080/riegsecker-todo-manager/"
        exec {
            workingDir home
            environment 'JAVA_HOME', javaHome
            commandLine 'cmd', '/c', 'bin\\catalina.bat', 'run'
        }
    }
}

tasks.register('stopTomcat') {
    group = 'application'
    description = 'Stops the configured Tomcat server.'
    dependsOn tasks.named('prepareTomcat')
    doLast {
        def home = requireTomcatHome()
        exec {
            workingDir home
            ignoreExitValue = true
            commandLine 'cmd', '/c', 'bin\\shutdown.bat'
        }
    }
}

tasks.named('deployToTomcat') {
    mustRunAfter tasks.named('stopTomcat')
}
