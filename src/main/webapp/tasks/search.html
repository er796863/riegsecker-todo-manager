<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../shared/entities.css" />
    <title>Search tasks</title>
  </head>
  <body data-entity="tasks" data-mode="search" data-label="Tasks">
    <header>
      <a href="../">Home</a>
      <nav aria-label="Task pages">
        <a href="./index.html">All tasks</a>
        <a href="./search.html">Search tasks</a>
      </nav>
    </header>
    <main>
      <h1>Search tasks</h1>
      <form id="search-form">
        <label for="search">Search by ID, title, or description</label><br />
        <input id="search" name="search" type="search" />
        <button type="submit">Search</button>
      </form>
      <p id="status" role="status" aria-live="polite">Enter a search term.</p>
      <section id="results" aria-label="Matching tasks"></section>
    </main>
    <script type="module" src="../shared/entities.js"></script>
  </body>
</html>
