<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../shared/entities.css" />
    <title>Sign in · ToDo Manager</title>
  </head>
  <body>
    <header data-global-header></header>
    <main>
      <h1>Sign in</h1>
      <form id="account-form" data-mode="login">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required maxlength="50" />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button id="account-submit" type="submit">Sign in</button>
      </form>
      <output id="account-status" aria-live="polite"></output>
      <p>New here? <a href="./register.html">Create an account</a>.</p>
    </main>
    <script type="module" src="../shared/account.js"></script>
  </body>
</html>
