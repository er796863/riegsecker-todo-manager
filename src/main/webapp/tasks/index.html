<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../shared/entities.css" />
    <title>Tasks</title>
  </head>
  <body data-entity="tasks" data-mode="list" data-label="Tasks">
    <header data-global-header></header>

    <nav class="page-nav" aria-label="Task pages">
      <a href="./index.html">My tasks</a>
      <a href="./search.html">Search tasks</a>
    </nav>

    <main>
      <h1>My tasks</h1>
      <output id="status" aria-live="polite">Loading tasks...</output>
      <form id="task-form" hidden>
        <h2 id="task-form-heading">Create task</h2>
        <label for="task-title">Title</label>
        <input id="task-title" name="taskTitle" required maxlength="150" />
        <label for="task-description">Description</label>
        <textarea id="task-description" name="taskDescription" maxlength="1000"></textarea>
        <label for="task-due-date">Due date</label>
        <input id="task-due-date" name="taskDateDue" type="datetime-local" />
        <div class="form-actions">
          <button id="task-submit" type="submit">Create task</button>
          <button id="task-cancel" type="button" hidden>Cancel edit</button>
        </div>
      </form>
      <section id="task-results" aria-label="Your tasks"></section>
    </main>
    <script type="module" src="./manage.js"></script>
  </body>
</html>
